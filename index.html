<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--https://blog.shaoao.top/2023/10/04/tutorial/biliqianru/-->
    <nav class="category-nav">
    <button data-category="all" class="active">全部</button>
    <button data-category="series">多集系列</button>
    <button data-category="single">单集视频</button>
</nav>
<div class="video-container">
    <div id="videoContainer" class="video-grid"></div>
    <div class="video-wrapper">
        <iframe 
            src="//player.bilibili.com/player.html?bvid=BV1BF411D7LZ&high_quality=1&autoplay=0"
            frameborder="no" 
            scrolling="no"
            allowfullscreen="allowfullscreen"
            sandbox="allow-scripts allow-same-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
    </div>

    <div style="position: relative; padding: 30% 45%;">
        <iframe style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;" 
        src="//www.bilibili.com/blackboard/html5mobileplayer.html?aid=275949729&bvid=BV1BF411D7LZ&cid=1265069356&p=1" frameborder="no" scrolling="no"></iframe>
    </div>
 

    <div style="position: relative; padding: 30% 45%;">
        <iframe style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;" 
        src="//www.bilibili.com/blackboard/html5mobileplayer.html?aid=114030307968277&bvid=BV1b8AkePEw4&cid=28473164519&p=1" 
        scrolling="no"
         border="0" 
         frameborder="no"

     </div>
</div>
