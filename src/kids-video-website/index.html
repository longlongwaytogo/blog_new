<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童视频站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        main {
            display: flex !important;
            flex-direction: row !important;
        }
        #videos-container {
            flex: 1 !important;
        }
        
        /* 响应式设计，适配不同分辨率 */
        /* 播放器响应式设计 */
        .single-video-container {
            width: 100% !important;
            height: 0 !important;
            padding-bottom: 56.25% !important; /* 16:9 宽高比 */
            position: relative !important;
            max-height: 70vh !important;
            max-width: 100% !important;
            margin: 0 auto !important;
        }
        
        .single-video-container iframe {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            max-height: 70vh !important;
        }
        
        /* Bilibili风格播放器响应式设计 */
        .bilibili-player {
            display: flex !important;
            flex-direction: column !important;
            width: 100% !important;
            max-height: 80vh !important;
        }
        
        .main-player {
            width: 100% !important;
            position: relative !important;
            padding-bottom: 56.25% !important; /* 16:9 宽高比 */
            height: 0 !important;
        }
        
        .main-player iframe {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        .playlist {
            width: 100% !important;
            max-height: 30vh !important;
            overflow-y: auto !important;
        }
        
        /* 平板设备（768px及以上）响应式布局 */
        @media (min-width: 768px) {
            .bilibili-player {
                flex-direction: row !important;
            }
            
            .main-player {
                width: 70% !important;
                padding-bottom: 39.375% !important; /* 16:9 宽高比的70% */
            }
            
            .playlist {
                width: 30% !important;
                max-height: none !important;
                height: auto !important;
            }
            
            .single-video-container {
                max-width: 90% !important;
            }
        }
        
        /* 大屏PC设备（1200px及以上）响应式布局 */
        @media (min-width: 1200px) {
            .main-player {
                width: 75% !important;
                padding-bottom: 42.1875% !important; /* 16:9 宽高比的75% */
            }
            
            .playlist {
                width: 25% !important;
            }
            
            .single-video-container {
                max-width: 80% !important;
                max-height: 80vh !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>儿童视频站</h1>
        </header>
        
        <main>
            <aside class="sidebar">
                <h2>视频分类</h2>
                <div id="category-tree"></div>
            </aside>
            
            <section id="videos-container">
                <h2 id="video-collection-title"></h2>
                <div id="video-grid"></div>
            </section>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
