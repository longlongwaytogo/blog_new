<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV 探索与发现</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .header {
            background-color: #d9272e;
            color: white;
            padding: 10px 20px;
            text-align: center;
            font-family: sans-serif;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CCTV动画</h1>
    </div>
    <div class="iframe-container">
        <iframe src="https://tv.cctv.cn/lm/tsfx/" allowfullscreen></iframe>
    </div>
</body>
</html>
